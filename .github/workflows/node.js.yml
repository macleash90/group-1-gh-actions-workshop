# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: "Build and Test"
    runs-on: ubuntu-latest
    env:
      MY_NODEJS_VERSION: "22.x"

    permissions:
      # Required to allow actions/checkout to clone the repository onto the runner
      contents: read
      # Required to allow the vitest coverage action to write a comment into the pull request
      pull-requests: write

    #strategy:
    #  matrix:
    #    node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js $MY_NODEJS_VERSION
      uses: actions/setup-node@v4
      with:
        node-version: $MY_NODEJS_VERSION
        cache: 'npm'
    - run: npm install
    - run: npm run build --if-present
    - run: npm test
    - uses: davelosert/vitest-coverage-report-action@v2
      with:
        vite-config-path: vite.config.ts
    - name: 'Test'
      run: npx vitest --coverage.enabled true
    #- name: 'Report Coverage'
      # Set if: always() to also generate the report if tests are failing
      # Only works if you set `reportOnFailure: true` in your vite config as specified above
    #  if: always() 
    # uses:  davelosert/vitest-coverage-report-action@v2
